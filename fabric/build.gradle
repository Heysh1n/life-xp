plugins {
    id "com.gradleup.shadow" version "9.0.0"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.blamejared.com/" }
}

def currentMc = rootProject.findProperty("minecraft_version")?.toString() ?: ""
def isObfuscated = currentMc.startsWith("1.")

dependencies {
    if (isObfuscated) {
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
        modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

        common(project(path: ":common")) { transitive false }
        shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

        modImplementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-fabric"
        modImplementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
        if (rootProject.minecraft_version != "1.21.4") {
            modLocalRuntime "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
        }
    } else {
        implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
        api "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

        common(project(path: ":common")) { transitive false }
        shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

        implementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-fabric"
        implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
        if (rootProject.minecraft_version != "1.21.4") {
            runtimeOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
        }
    }
}

if (isObfuscated) {
    shadowJar {
        configurations = [project.configurations.shadowCommon]
        archiveClassifier.set("dev-shadow")
    }

    remapJar {
        injectAccessWidener = true
        input.set shadowJar.archiveFile
        dependsOn shadowJar
        archiveClassifier.set("fabric")
    }
} else {
    shadowJar {
        configurations = [project.configurations.shadowCommon]
        archiveClassifier.set("fabric")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
