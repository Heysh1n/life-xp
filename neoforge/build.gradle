plugins {
    id "com.gradleup.shadow" version "9.0.0"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://thedarkcolour.github.io/KotlinForForge/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    api "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

    compileOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-neoforge"
    runtimeOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-neoforge"
    runtimeOnly "mezz.jei:jei-26.2-neoforge:${rootProject.jei_version}"

    runtimeOnly "org.quiltmc.parsers:json:0.2.1"
    runtimeOnly "org.quiltmc.parsers:gson:0.2.1"
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("neoforge")
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}
