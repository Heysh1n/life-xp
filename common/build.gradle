architectury {
    common("fabric", "neoforge")
}

repositories {
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.blamejared.com/" }
}

dependencies {
    implementation "dev.architectury:architectury:${rootProject.architectury_version}"
    compileOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-fabric"
    compileOnly "mezz.jei:jei-26.2-common-api:${rootProject.jei_version}"
    // EMI не имеет релиза под Minecraft 26.2 (последняя версия 1.1.24+1.21.1)
    // compileOnly "dev.emi:emi-xplat-mojmap:${rootProject.emi_version}:api"
}
